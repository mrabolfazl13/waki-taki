name: docker

on:
  push:
    branches: [main]
    paths: ["backend/**", "web/**", "backend/Dockerfile", "web/Dockerfile", "web/nginx.conf", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "web/**", "backend/Dockerfile", "web/Dockerfile", "web/nginx.conf", ".github/workflows/docker.yml"]

env:
  REGISTRY: ghcr.io

jobs:
  backend-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ secrets.DOCKER_PUSH_ENABLED == 'true' && github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ secrets.DOCKER_PUSH_ENABLED == 'true' && github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securetalk_migrate
          POSTGRES_USER: securetalk
          POSTGRES_PASSWORD: migratepassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securetalk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://securetalk:migratepassword@127.0.0.1:5432/securetalk_migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply migrations to ephemeral Postgres
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migrations are idempotent (re-run)
        working-directory: backend
        run: alembic upgrade head
      - name: Verify clean database can downgrade one step
        working-directory: backend
        run: alembic downgrade -1
