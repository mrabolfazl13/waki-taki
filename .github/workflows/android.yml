name: android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # Explicit test task: a failing unit test fails this workflow.
      # `test` covers every module (core/common, core/security, core/audio,
      # core/network, ...) — `:app:testDebugUnitTest` alone would skip them.
      - name: Run unit tests
        run: |
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-test.log
          exit ${PIPESTATUS[0]}
      - name: Publish test log to summary
        if: failure()
        run: |
          grep -E "^e: " /tmp/gradle-test.log | head -8 | while IFS= read -r line; do
            echo "::error::${line/#e: /}"
          done
          {
            echo "### What went wrong"
            grep -A 15 "What went wrong" /tmp/gradle-test.log || tail -30 /tmp/gradle-test.log
          } | sed 's/::error::/ERR:/g' >> "$GITHUB_STEP_SUMMARY"
          grep -A 15 "What went wrong" /tmp/gradle-test.log | head -6 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
