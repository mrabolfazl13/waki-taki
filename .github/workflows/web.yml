name: web

on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # npm ci occasionally dies with "Exit handler never called!" on GH
        # runners; retry once with a plain install before failing the job.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck
        # Use the workspace binary (never npx, which can fetch the wrong tsc).
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
