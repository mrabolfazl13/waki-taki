# nginx config baked into the web image (container-internal, plain HTTP).
# TLS termination and /ws proxying happen at the edge nginx in deploy/nginx/securetalk.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Build output is content-hashed; cache hard, but never index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
