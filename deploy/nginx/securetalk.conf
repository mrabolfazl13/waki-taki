# SecureTalk edge nginx: TLS termination + WebSocket upgrade for /ws.
# Proxies /api and /api/v1/ws to the api container (compose service `api`).

upstream securetalk_api {
    server api:8000;
    keepalive 32;
}

upstream securetalk_web {
    server web:80;
    keepalive 16;
}

# Redirect all plain HTTP to HTTPS (except ACME challenge for certbot)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS certificates: self-signed for test (see deploy/README.md) or
    # certbot fullchain/privkey for production.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS + browser hardening. CSP allows the SPA's own bundle, data: images
    # and WebSocket connections; no third-party origins are needed.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    # WebSocket: /api/v1/ws and /ws (ARCHITECTURE §5: WS /ws?token=...)
    location ~ ^/(api/v1/ws|ws)$ {
        proxy_pass http://securetalk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived WS sessions open
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # REST API
    location /api/ {
        proxy_pass http://securetalk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health endpoint passthrough (for external LB checks and dashboard probes)
    location = /health {
        proxy_pass http://securetalk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Admin dashboard (built SPA served by the web image's own nginx).
    location / {
        proxy_pass http://securetalk_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
